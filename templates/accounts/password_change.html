{% extends "base.html" %}
{% block title %}Change password · {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-semibold">Change password</h1>
  <form method="post" class="card mt-6 space-y-4 p-6" novalidate>
    {% csrf_token %}
    {% include "partials/_form_errors.html" %}
    {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
    <div class="flex gap-3">
      <button type="submit" class="btn btn-primary">Save password</button>
      <a href="{% url 'accounts:profile' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
