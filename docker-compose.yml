services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: depthub
      POSTGRES_USER: depthub
      POSTGRES_PASSWORD: depthub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U depthub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
