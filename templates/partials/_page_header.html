<div class="mb-6 flex flex-wrap items-end justify-between gap-4">
  <div class="min-w-0">
    {% if back_url %}<a href="{{ back_url }}" class="text-sm text-brand-700 hover:underline">← {{ back_label|default:"Back" }}</a>{% endif %}
    <h1 class="mt-1 text-2xl font-semibold text-slate-900">{{ title }}</h1>
    {% if subtitle %}<p class="mt-1 text-sm text-slate-600">{{ subtitle }}</p>{% endif %}
  </div>
</div>
