{% extends "base.html" %}
{% block title %}Check your email · {{ SITE_NAME }}{% endblock %}

{% block public_content %}
<div class="card p-6 text-center sm:p-8">
  <h1 class="text-xl font-semibold">Check your email</h1>
  <p class="mt-2 text-sm text-slate-600">If an account exists for that address, we've sent a link to reset the password. It expires in a few days.</p>
  <a href="{% url 'accounts:login' %}" class="btn btn-secondary mt-6">Back to sign in</a>
</div>
{% endblock %}
