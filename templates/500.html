<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f8fafc; color: #1e293b; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; }
    .box { max-width: 28rem; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 32px; text-align: center; }
    a { color: #1a6b4d; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Something went wrong</h1>
    <p>We couldn't complete that request. Please try again in a moment. If it keeps happening, contact your department administrator.</p>
    <p><a href="/">Go home</a></p>
  </div>
</body>
</html>
